name: Build icon packages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build-all
      - uses: actions/upload-artifact@v7
        with:
          name: devicon-packages
          path: |
            packages/core
            packages/react
            packages/vue
            packages/svelte
          if-no-files-found: error
          retention-days: 14
