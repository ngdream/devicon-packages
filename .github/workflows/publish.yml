name: Publish packages to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'ngdream/devicon-packages'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Use npm with OIDC publishing support
        run: npm install --global npm@11.21.0
      - run: npm ci
      - run: npm run build-all
      - name: Set package versions from tag
        run: node scripts/prepare-release.mjs "$GITHUB_REF_NAME"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish React, Vue and Svelte
        run: |
          dist_tag=latest
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then dist_tag=next; fi
          for package in react vue svelte; do
            npm publish "./packages/$package" --access public --tag "$dist_tag" --loglevel error
          done
